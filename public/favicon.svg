<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="cosmicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Squircle Obsidian Base Frame -->
  <rect width="100" height="100" rx="22" fill="#0B0F17"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Ambient Barycenter Starlight Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#cosmicGlow)"/>

  <!-- Wavefront Inner Airy Diffraction Ring -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#E5A93C" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.35"/>

  <!-- Tilted Relativistic Keplerian Orbit Ring (-28 deg) -->
  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#E5A93C" stroke-width="2.2" opacity="0.9"/>
    <!-- Orbiting Satellite Node Dot -->
    <circle cx="12" cy="50" r="3.6" fill="#38BDF8"/>
  </g>

  <!-- Central 4-Point Diffraction Star / Wavefront Cross -->
  <path d="M 50 32 Q 50 50 32 50 Q 50 50 50 68 Q 50 50 68 50 Q 50 50 50 32 Z" fill="#E5A93C"/>
  <circle cx="50" cy="50" r="3" fill="#FFFBF0"/>
</svg>
