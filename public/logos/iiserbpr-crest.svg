<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="iiser-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iiser-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <!-- Base Shield Ring -->
  <circle cx="50" cy="50" r="46" fill="#0B132B" stroke="url(#iiser-gold)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Orbital Rings -->
  <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="#38BDF8" stroke-width="1.8" transform="rotate(30 50 50)" />
  <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="url(#iiser-gold)" stroke-width="1.8" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="#93C5FD" stroke-width="1.2" transform="rotate(90 50 50)" />
  
  <!-- Central Nucleus Glow -->
  <circle cx="50" cy="50" r="14" fill="url(#iiser-glow)" />
  <circle cx="50" cy="50" r="5.5" fill="url(#iiser-gold)" />
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />

  <!-- Orbiting Quantum Particles -->
  <circle cx="78" cy="34" r="3" fill="#38BDF8" />
  <circle cx="22" cy="66" r="3" fill="#F59E0B" />
  <circle cx="50" cy="18" r="2.5" fill="#60A5FA" />
</svg>
