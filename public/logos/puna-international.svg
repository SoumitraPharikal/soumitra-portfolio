<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="puna-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="puna-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <!-- Circular Shield Frame -->
  <circle cx="50" cy="50" r="46" fill="url(#puna-blue)" stroke="url(#puna-gold)" stroke-width="3" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#puna-gold)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Open Academic Book -->
  <path d="M 50 48 C 44 42 34 42 26 44 L 26 62 C 34 60 44 60 50 66 C 56 60 66 60 74 62 L 74 44 C 66 42 56 42 50 48 Z"
        fill="#FFFFFF" stroke="url(#puna-gold)" stroke-width="1.5" />
  <line x1="50" y1="48" x2="50" y2="66" stroke="url(#puna-gold)" stroke-width="1.5" />

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <path d="M 22 42 C 20 52 24 64 34 72" fill="none" stroke="url(#puna-gold)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 78 42 C 80 52 76 64 66 72" fill="none" stroke="url(#puna-gold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Academic Sun / Rays Motif -->
  <circle cx="50" cy="30" r="6" fill="url(#puna-gold)" />
  <line x1="50" y1="18" x2="50" y2="22" stroke="url(#puna-gold)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="22" x2="43" y2="25" stroke="url(#puna-gold)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="22" x2="57" y2="25" stroke="url(#puna-gold)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Monogram & Header Text -->
  <text x="50" y="78" font-family="'Geist', -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">PUNA INT'L</text>
  <text x="50" y="85" font-family="'Geist', -apple-system, sans-serif" font-size="4.8" font-weight="600" fill="url(#puna-gold)" text-anchor="middle" letter-spacing="0.6">GANDHINAGAR</text>
</svg>
